<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0f0f0f">
  <title>DeepSeek 考研助手</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app { width: 100%; max-width: 600px; height: 100vh; display: flex; flex-direction: column; background: #1a1a1a; border-radius: 0; box-shadow: 0 0 30px rgba(0,0,0,0.5); overflow: hidden; }
    @media (min-width: 600px) { .app { height: 90vh; margin: 20px; border-radius: 20px; } }

    /* 顶部导航 */
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #252525; border-bottom: 1px solid #333; }
    .nav h2 { font-size: 1.2rem; font-weight: 600; }
    .nav-actions { display: flex; gap: 10px; }
    .nav-btn { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; padding: 6px; border-radius: 8px; }
    .nav-btn:hover { background: #333; color: #fff; }

    /* 模式切换 */
    .mode-switch { display: flex; padding: 8px 16px; background: #1e1e1e; gap: 5px; border-bottom: 1px solid #333; }
    .mode-btn { flex:1; padding: 8px 0; background: transparent; border: 1px solid #444; color: #aaa; border-radius: 8px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .mode-btn.active { background: #2b5b84; border-color: #3a7bbf; color: #fff; }

    /* 对话区域 */
    .chat-container { flex:1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; position: relative; }
    .message.user { align-self: flex-end; background: #2b5b84; color: #fff; border-bottom-right-radius: 4px; }
    .message.assistant { align-self: flex-start; background: #2a2a2a; border-bottom-left-radius: 4px; white-space: pre-wrap; }
    .message .timestamp { font-size: 0.7rem; color: #888; margin-top: 4px; }
    .message .actions { display: none; position: absolute; top: -8px; right: 6px; gap: 4px; }
    .message:hover .actions { display: flex; }
    .action-btn { background: #444; border: none; color: #fff; width: 24px; height: 24px; border-radius: 50%; font-size: 0.7rem; cursor: pointer; line-height: 24px; text-align: center; }

    /* 输入区域 */
    .input-area { padding: 12px 16px; background: #252525; border-top: 1px solid #333; }
    .tools { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .tool-btn { background: #333; border: none; color: #ccc; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .tool-btn:hover { background: #444; }
    .input-row { display: flex; gap: 8px; }
    .input-row textarea { flex:1; background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; resize: none; height: 44px; max-height: 120px; font-family: inherit; }
    .send-btn { background: #2b5b84; border: none; color: #fff; padding: 0 16px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; }
    .send-btn:disabled { opacity: 0.5; pointer-events: none; }

    /* 侧边栏（对话列表/搜索） */
    .sidebar { position: fixed; top:0; left:0; width: 280px; height: 100%; background: #1a1a1a; box-shadow: 2px 0 10px rgba(0,0,0,0.5); transform: translateX(-100%); transition: transform 0.3s; z-index: 100; display: flex; flex-direction: column; padding: 16px; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .search-box { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #444; background: #252525; color: #fff; margin-bottom: 12px; }
    .conversation-list { flex:1; overflow-y: auto; }
    .conv-item { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .conv-item:hover { background: #2a2a2a; }
    .conv-item.active { background: #2b5b84; }
    .conv-item .del-conv { background: none; border: none; color: #f55; cursor: pointer; font-size: 0.8rem; }

    /* 用量面板 */
    .usage-panel { background: #252525; padding: 12px; border-radius: 10px; margin-bottom: 12px; }
    .usage-panel p { font-size: 0.85rem; display: flex; justify-content: space-between; margin-bottom: 6px; }

    /* 设置页 */
    .setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; text-align: center; }
    .setup-screen h2 { margin-bottom: 20px; }
    .setup-screen input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #555; background: #1e1e1e; color: #fff; font-size: 1rem; margin-bottom: 16px; }
    .setup-screen button { background: #2b5b84; border: none; color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 1rem; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 设置页（仅首次） -->
  <div id="setup-screen" class="setup-screen hidden">
    <h2>🔑 输入你的 DeepSeek API Key</h2>
    <p style="margin-bottom:20px; color:#aaa;">Key 仅保存在本机，不会上传到任何服务器</p>
    <input type="password" id="api-key-input" placeholder="sk-...">
    <button onclick="saveApiKey()">开始使用</button>
  </div>

  <!-- 主应用 -->
  <div id="app" class="app">
    <!-- 导航 -->
    <div class="nav">
      <button class="nav-btn" onclick="toggleSidebar()">☰</button>
      <h2>考研助手</h2>
      <div class="nav-actions">
        <button class="nav-btn" onclick="toggleUsagePanel()">📊</button>
        <button class="nav-btn" onclick="resetApiKey()">⚙️</button>
      </div>
    </div>

    <!-- 模式选择 -->
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="quick" onclick="switchMode('quick')">⚡ 快速查询</button>
      <button class="mode-btn" data-mode="reasoning" onclick="switchMode('reasoning')">🧠 深度推理</button>
    </div>

    <!-- 对话区 -->
    <div id="chat-container" class="chat-container"></div>

    <!-- 输入区 -->
    <div class="input-area">
      <div class="tools">
        <label class="tool-btn">
          📎 附件 <input type="file" id="file-input" style="display:none" accept=".txt,.md,.csv,.json,image/*,.pdf,.docx">
        </label>
        <span id="file-name" style="font-size:0.8rem; color:#aaa;"></span>
        <button class="tool-btn" onclick="clearFile()" style="display:none;" id="clear-file-btn">✕</button>
      </div>
      <div class="input-row">
        <textarea id="user-input" rows="1" placeholder="输入问题..."></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <!-- 侧边栏（会话列表） -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h3>对话记录</h3>
        <button class="nav-btn" onclick="toggleSidebar()">✕</button>
      </div>
      <input type="text" class="search-box" placeholder="🔍 搜索消息..." oninput="filterConversations(this.value)">
      <div class="conversation-list" id="conv-list"></div>
      <button style="margin-top:12px; background:#333; border:none; color:#fff; padding:8px; border-radius:8px;" onclick="newConversation()">+ 新建对话</button>
    </div>

    <!-- 用量浮层 -->
    <div id="usage-panel" class="usage-panel hidden" style="position:fixed; top:80px; right:16px; width:250px;">
      <p><span>今日预估 Token:</span><span id="today-tokens">0</span></p>
      <p><span>本月预估 Token:</span><span id="month-tokens">0</span></p>
      <p><span>请求次数:</span><span id="req-count">0</span></p>
      <button style="width:100%; margin-top:8px; background:#444; border:none; color:#fff; padding:6px; border-radius:6px;" onclick="window.open('https://platform.deepseek.com/usage', '_blank')">查看官方余额 →</button>
      <button style="width:100%; margin-top:4px; background:#444; border:none; color:#fff; padding:6px; border-radius:6px;" onclick="resetUsageStats()">重置统计</button>
    </div>
  </div>

  <script>
    // ==================== 全局状态 ====================
    let currentMode = 'quick';               // quick / reasoning
    let currentConversationId = null;
    let conversations = {};                 // { id: { title, messages: [], createdAt } }
    let fileContent = null;
    let fileName = null;
    let usage = JSON.parse(localStorage.getItem('ds_usage') || '{"today":0,"month":0,"count":0,"date":"","monthKey":""}');

    const API_KEY = localStorage.getItem('ds_api_key');

    // ==================== 初始化 ====================
    window.addEventListener('DOMContentLoaded', () => {
      if (!API_KEY) {
        document.getElementById('setup-screen').classList.remove('hidden');
        document.getElementById('app').classList.add('hidden');
      } else {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        loadConversations();
        if (Object.keys(conversations).length === 0) newConversation();
        else {
          const lastId = localStorage.getItem('ds_last_conv');
          currentConversationId = lastId && conversations[lastId] ? lastId : Object.keys(conversations)[0];
          renderChat();
          updateConvList();
        }
        updateUsageDisplay();
      }
    });

    // 注册 Service Worker（离线缓存）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
    // iOS 添加至主屏幕提示（忽略）

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (!key.startsWith('sk-')) { alert('Key 格式不正确'); return; }
      localStorage.setItem('ds_api_key', key);
      location.reload();
    }

    function resetApiKey() {
      if (confirm('确定要移除 API Key 吗？')) {
        localStorage.removeItem('ds_api_key');
        location.reload();
      }
    }

    // ==================== 对话管理 ====================
    function loadConversations() {
      const saved = localStorage.getItem('ds_conversations');
      if (saved) conversations = JSON.parse(saved);
    }

    function saveConversations() {
      localStorage.setItem('ds_conversations', JSON.stringify(conversations));
      localStorage.setItem('ds_last_conv', currentConversationId);
    }

    function newConversation() {
      const id = Date.now().toString();
      conversations[id] = {
        title: '新对话',
        messages: [],
        createdAt: new Date().toISOString()
      };
      currentConversationId = id;
      saveConversations();
      renderChat();
      updateConvList();
      toggleSidebar(false);
    }

    function deleteConversation(id) {
      if (!confirm('删除此对话？')) return;
      delete conversations[id];
      if (currentConversationId === id) {
        const ids = Object.keys(conversations);
        currentConversationId = ids.length > 0 ? ids[0] : null;
        if (!currentConversationId) newConversation();
      }
      saveConversations();
      renderChat();
      updateConvList();
    }

    function switchConversation(id) {
      currentConversationId = id;
      saveConversations();
      renderChat();
      updateConvList();
      toggleSidebar(false);
    }

    // ==================== 消息渲染 ====================
    function renderChat() {
      const container = document.getElementById('chat-container');
      if (!currentConversationId || !conversations[currentConversationId]) {
        container.innerHTML = '<div style="text-align:center; color:#666; margin-top:40px;">开始新对话</div>';
        return;
      }
      const msgs = conversations[currentConversationId].messages;
      container.innerHTML = msgs.map((msg, index) => {
        const roleClass = msg.role === 'user' ? 'user' : 'assistant';
        return `
          <div class="message ${roleClass}">
            <div class="content">${escapeHtml(msg.content)}</div>
            <div class="timestamp">${new Date(msg.timestamp).toLocaleTimeString()}</div>
            <div class="actions">
              <button class="action-btn" title="删除" onclick="deleteMessage(${index})">🗑</button>
            </div>
          </div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    function deleteMessage(index) {
      if (!confirm('删除这条消息？')) return;
      conversations[currentConversationId].messages.splice(index, 1);
      saveConversations();
      renderChat();
    }

    function appendMessage(role, content) {
      conversations[currentConversationId].messages.push({
        role, content,
        timestamp: Date.now()
      });
      // 自动更新对话标题（用第一条用户消息）
      if (role === 'user' && conversations[currentConversationId].messages.filter(m=>m.role==='user').length === 1) {
        conversations[currentConversationId].title = content.substring(0, 30);
      }
      saveConversations();
      renderChat();
      updateConvList();
    }

    // ==================== 发送消息 ====================
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text && !fileContent) return;

      const apiKey = localStorage.getItem('ds_api_key');
      if (!apiKey) { alert('请先设置 API Key'); return; }

      // 组合用户消息
      let fullUserMessage = text;
      if (fileContent) {
        fullUserMessage += `\n\n[文件内容: ${fileName}]\n${fileContent}`;
      }

      appendMessage('user', fullUserMessage);
      input.value = '';
      clearFile();

      // 构建消息数组
      const messages = buildMessagesArray(fullUserMessage);

      // 发送请求
      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      const placeholder = appendMessage('assistant', '思考中...');
      const placeholderIndex = conversations[currentConversationId].messages.length - 1;

      try {
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: currentMode === 'reasoning' ? 'deepseek-reasoner' : 'deepseek-chat',
            messages: messages,
            stream: false,
            max_tokens: currentMode === 'reasoning' ? 4096 : 1024
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || '请求失败');
        }

        const data = await response.json();
        const reply = data.choices[0].message.content;
        // 替换占位消息
        conversations[currentConversationId].messages[placeholderIndex].content = reply;
        // 记录用量（估算）
        trackUsage(data.usage?.total_tokens || 0);
        saveConversations();
        renderChat();
      } catch (error) {
        conversations[currentConversationId].messages[placeholderIndex].content = `❌ 错误: ${error.message}`;
        saveConversations();
        renderChat();
      } finally {
        sendBtn.disabled = false;
        updateUsageDisplay();
      }
    }

    function buildMessagesArray(currentUserMsg) {
      // 系统提示词（偏好记忆）
      const preferences = JSON.parse(localStorage.getItem('ds_preferences') || '{"language":"中文","detail":"简洁"}');
      const systemPrompt = `你是考研助手。用户偏好：语言-${preferences.language}，回答风格-${preferences.detail}。${currentMode==='reasoning'?'请给出详尽的推理步骤、公式推导和解释。':'请简洁回答，直接给出答案或关键点。'}`;
      
      let msgs = [{ role: 'system', content: systemPrompt }];
      // 取最近的对话历史（限制上下文长度）
      const history = conversations[currentConversationId].messages.slice(-10); // 最近10条
      history.forEach(m => msgs.push({ role: m.role, content: m.content }));
      return msgs;
    }

    // ==================== 模式切换 ====================
    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
    }

    // ==================== 文件处理 ====================
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      fileName = file.name;
      document.getElementById('file-name').textContent = fileName;
      document.getElementById('clear-file-btn').style.display = 'inline-block';

      // 读取文本（或图片转base64，这里只示例文本）
      if (file.type.startsWith('text/') || file.name.endsWith('.md') || file.name.endsWith('.json')) {
        const reader = new FileReader();
        reader.onload = (ev) => { fileContent = ev.target.result; };
        reader.readAsText(file);
      } else if (file.type.startsWith('image/')) {
        // 图片暂不支持，提示
        alert('图片功能需要多模态模型，目前 DeepSeek API 不支持，请先将图片文字 OCR 后粘贴。');
        clearFile();
      } else {
        alert('暂不支持该文件类型，请使用文本文件。');
        clearFile();
      }
    });

    function clearFile() {
      fileContent = null;
      fileName = null;
      document.getElementById('file-input').value = '';
      document.getElementById('file-name').textContent = '';
      document.getElementById('clear-file-btn').style.display = 'none';
    }

    // ==================== 偏好设置（简单示例） ====================
    // 可以在导航栏加一个偏好按钮，弹出设置框。这里略，但保留localStorage读取
    window.savePreferences = (prefs) => {
      localStorage.setItem('ds_preferences', JSON.stringify(prefs));
    };

    // ==================== 用量追踪（本地估算） ====================
    function trackUsage(tokens) {
      const today = new Date().toDateString();
      const month = new Date().getMonth() + '-' + new Date().getFullYear();
      if (usage.date !== today) { usage.today = 0; usage.date = today; }
      if (usage.monthKey !== month) { usage.month = 0; usage.monthKey = month; }
      usage.today += tokens;
      usage.month += tokens;
      usage.count += 1;
      localStorage.setItem('ds_usage', JSON.stringify(usage));
    }

    function updateUsageDisplay() {
      document.getElementById('today-tokens').textContent = usage.today;
      document.getElementById('month-tokens').textContent = usage.month;
      document.getElementById('req-count').textContent = usage.count;
    }

    function resetUsageStats() {
      usage = { today:0, month:0, count:0, date:usage.date, monthKey:usage.monthKey };
      localStorage.setItem('ds_usage', JSON.stringify(usage));
      updateUsageDisplay();
    }

    function toggleUsagePanel() {
      document.getElementById('usage-panel').classList.toggle('hidden');
    }

    // ==================== 侧边栏 & 搜索 ====================
    function toggleSidebar(force) {
      const sidebar = document.getElementById('sidebar');
      if (typeof force === 'boolean') sidebar.classList.toggle('open', force);
      else sidebar.classList.toggle('open');
    }

    function updateConvList() {
      const list = document.getElementById('conv-list');
      const ids = Object.keys(conversations).sort((a,b) => b - a);
      list.innerHTML = ids.map(id => {
        const conv = conversations[id];
        const activeClass = id === currentConversationId ? 'active' : '';
        return `<div class="conv-item ${activeClass}" onclick="switchConversation('${id}')">
          <span>${escapeHtml(conv.title || '新对话')}</span>
          <button class="del-conv" onclick="event.stopPropagation();deleteConversation('${id}')">🗑</button>
        </div>`;
      }).join('');
    }

    function filterConversations(query) {
      const items = document.querySelectorAll('.conv-item');
      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(query.toLowerCase()) ? 'flex' : 'none';
      });
    }

    // ==================== 工具函数 ====================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 自动调整输入框高度
    document.getElementById('user-input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // 回车发送（Shift+回车换行）
    document.getElementById('user-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
